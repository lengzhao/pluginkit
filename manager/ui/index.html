<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pluginkit manager</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <h1>pluginkit manager</h1>
      <p>实例导航 · 装配树 · 检查器</p>
    </div>
    <div class="controls">
      <label>
        Root ID
        <input id="rootId" type="text" placeholder="agent">
      </label>
      <label>
        Root Kind
        <select id="rootKind"></select>
      </label>
      <button id="issueCount" type="button" class="issue-btn ok">0 个问题</button>
      <button id="btnNew" type="button">新建</button>
      <button id="btnImport" type="button">导入</button>
      <button id="btnExport" type="button">导出</button>
      <button id="btnBuild" type="button" class="primary">试装配</button>
    </div>
  </header>

  <main class="layout" id="layout">
    <aside id="navigator" class="navigator" aria-label="实例导航">
      <div class="nav-header">
        <h2>实例导航</h2>
        <button id="navCollapse" type="button" class="nav-toggle" title="折叠导航" aria-label="折叠导航">‹</button>
      </div>
      <div id="navBody" class="nav-body"></div>
    </aside>
    <button id="navExpand" type="button" class="nav-expand" hidden title="展开导航" aria-label="展开导航">›</button>
    <section id="canvas" class="canvas" aria-label="主画布">
      <div id="canvasBody" class="canvas-body"></div>
    </section>
    <aside id="inspector" class="inspector">
      <h2>检查器</h2>
      <div id="inspectorBody" class="inspector-body"></div>
      <details class="yaml-fold">
        <summary>YAML 预览</summary>
        <pre id="yamlPreview" class="yaml-preview"></pre>
      </details>
    </aside>
  </main>

  <dialog id="importDialog">
    <form method="dialog" id="importForm">
      <h3>导入 YAML</h3>
      <div class="dialog-toolbar">
        <button id="importPickFile" type="button">选择文件</button>
        <span class="dialog-hint">支持 .yaml / .yml</span>
      </div>
      <textarea id="yamlInput" rows="16" placeholder="或粘贴 YAML..."></textarea>
      <div class="dialog-actions">
        <button value="cancel" type="submit">取消</button>
        <button id="importConfirm" value="default" type="submit">导入</button>
      </div>
    </form>
  </dialog>

  <input id="importFile" type="file" accept=".yaml,.yml,text/yaml" hidden>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js?v=17"></script>
</body>
</html>
